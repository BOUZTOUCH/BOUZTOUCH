<!DOCTYPE html>

<html lang="da">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BOUZTOUCH Barber</title>

<style>

body {

  margin: 0;

  background: #080808;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

header { padding: 35px; border-bottom: 1px solid #333; }

h1 { letter-spacing: 6px; font-size: 34px; }

main { max-width: 420px; margin: auto; padding: 20px; }

section {

  background: #171717;

  padding: 25px;

  margin: 20px 0;

  border-radius: 12px;

}

.price { font-size: 32px; font-weight: bold; }

input, select, button {

  width: 100%;

  padding: 14px;

  margin: 8px 0;

  box-sizing: border-box;

  border-radius: 6px;

  font-size: 16px;

}

input, select { background: #222; color: white; border: 1px solid #555; }

button { background: white; color: black; border: 0; font-weight: bold; }

p { color: #bbb; }

</style>

</head>

<body>

<header>

<h1>BOUZTOUCH</h1>

<p>BARBER STUDIO</p>

</header>

<main>

<section>

<h2>BOOK DIN KLIPNING</h2>

<p>Professionel klipning</p>

<p class="price">100 KR.</p>

<p>45 minutter</p>

</section>

<section>

<h2>BOOK EN TID</h2>

<form id="booking">

<input type="text" placeholder="Dit fulde navn" required>

<input type="tel" placeholder="Dit telefonnummer" required>

<label>Vælg dato</label>

<input type="date" required>

<label>Vælg tidspunkt</label>

<select required>

<option value="">Vælg tidspunkt</option>

<option>17:00</option>

<option>17:45</option>

<option>18:30</option>

<option>19:15</option>

<option>20:00</option>

<option>20:45</option>

</select>

<label>Betaling</label>

<select required>

<option value="">Vælg betaling</option>

<option>MobilePay</option>

<option>Kontant</option>

</select>

<button type="submit">BOOK NU</button>

</form>

<p id="message"></p>

</section>

<section>

<h2>FIND OS</h2>

<p>Norgesgade 3</p>

<p>Klipning: 100 kr.</p>

<p>MobilePay eller kontant</p>

</section>

</main>

<footer>

<p>© BOUZTOUCH</p>

</footer>

<script>

document.getElementById("booking").addEventListener("submit", function(e) {

  e.preventDefault();

  document.getElementById("message").textContent =

  "Tak! Formularen er udfyldt, men bookingen er endnu ikke sendt.";

});

</script>

</body>

</html>
